[project]
name = "fastapi-visualizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tanmayrathi-sp18", email = "tanmay.rathi@sparkeighteen.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "django>=6.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# so tests can import the bundled examples (examples.django_demo)
pythonpath = ["."]
