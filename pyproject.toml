[project]
name = "fastapi-visualizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tanmayrathi-sp18", email = "tanmay.rathi@sparkeighteen.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# ASYNC = flake8-async: blocking calls inside `async def` -- time.sleep, open(),
# blocking HTTP, subprocess. Exactly the defect this tool detects at runtime,
# caught before the code ever runs, including on paths no request exercises.
# Deliberately narrow for now; widen when CI lands.
select = ["ASYNC"]

[tool.ruff.lint.per-file-ignores]
# The demo endpoints block the loop ON PURPOSE -- that is what they demonstrate.
"examples/demo.py" = ["ASYNC"]
# Tests construct blocking handlers deliberately to assert we detect them.
"tests/*" = ["ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
